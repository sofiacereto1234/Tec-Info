<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="stylees.css">
</head>
<body>
    <div id="banner">
        <button class="btn"><a href="index.html">Menú</a></button>
        <button class="btn"><a href="formulario.html">Frormulario</a>
        <button class="btn"><a href="videos.html">Videos</a></button>

    <div>
        <h1>Formulario de Registro</h1>
        <p>Completa todos los campos para crear tu cuenta</p>

        <form action="#" method="POST" id="registroForm">
            <fieldset>
                <legend>Datos Personales</legend>

                <div>
                    <label for="nombre">Nombre completo *</label>
                    <input type="text" name="nombre" placeholder="Nombre - Apellido" required>
                </div>

                <div>
                    <label for="DNI">DNI *</label>
                    <input type="number" placeholder="12345678" required>
                </div>

                <div>
                    <label for="fechaNacimiento">Fecha de nacimiento</label>
                    <input type="date" name="fechaNacimiento">
                </div>

                <div>
                    <label for="email">Correo electrónico *</label>
                    <input type="email" name="email" placeholder="Ej: juan@correo.com" required>
                </div>


                <div>
                    <label for="password">Contraseña *</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
                </div>

                <div>
                    <label for="telefono">Teléfono</label>
                    <input type="tel" name="telefono" placeholder="Ej: +54 11 1234-5678" required>
                </div>

                <div>
                    <label for="Curso">Curso al que desea inscribirse </label>
                    <select name="Curso" required multiple>
                        <option value="">Selecciona un Curso...</option>
                        <option value="1">Robotica</option>
                        <option value="2">Arduino</option>
                        <option value="3">Programcion</option>
                        <option value="4">historia de la tecnologia</option>
                    </select>
                </div>

            <div>
                <button id="TM">Turno Mañana</button>
                <button id="TT">Turno Tarde</button>
                <button id="TN">Turno Noche</button>
            </div>

            <div>
                    <label for="comentarios">¿Por que desea realizar el curzo?</label>
                    <textarea id="comentarios" name="comentarios" rows="4" placeholder="Escribe porque quiere realizar el curzo aquí..."></textarea>
            </div>

            <div>
                <label>
                    <input type="checkbox" name="terminos" required>
                    Acepto los <a href="https://www.argentina.gob.ar/terminos-y-condiciones">términos y condiciones</a> *
                </label>
            </div>
            
            <div>
                <button type="submit">Registrarse</button>
                <button type="reset">Limpiar formulario</button>
            </div>


    <footer>
        <p>Página realizada Sofia Cereto 4B</p>
    </footer>
</body>
</html>
